name: Feature request
description: Suggest an idea for the plugin.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This is a private hobby project: ideas are welcome, but there is no guarantee that they will be implemented.
        Only Somfy TaHoma (local API and Somfy cloud) is supported. Note that Apple Home limits what an accessory can show and do.
  - type: textarea
    id: idea
    attributes:
      label: What would you like the plugin to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What for?
      description: The situation in which you would use it.
  - type: input
    id: devices
    attributes:
      label: Device(s)
      placeholder: e.g. Somfy roller shutters with io-homecontrol
