name: Compatibility & CVE check
# Runs every Monday, on demand (Actions > Compatibility & CVE check > Run workflow) and on pull
# requests that change dependencies (e.g. from Dependabot) – merge them when all checks are green.
# 1. CVE: `npm audit` – fails on any known vulnerability in the runtime dependencies.
# 2. Homebridge: builds the plugin and starts it with the newest Homebridge release (and the beta)
#    on all supported Node.js versions (scripts/homebridge-smoke.mjs).
# GitHub notifies the repository owner by e-mail when a scheduled run fails.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['package.json', 'package-lock.json', '.github/workflows/compat.yml', 'scripts/homebridge-smoke.mjs']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/compat.yml', 'scripts/homebridge-smoke.mjs']

permissions:
  contents: read

jobs:
  audit:
    name: CVE check (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Runtime dependencies (fails on any vulnerability)
        run: npm audit --omit=dev --audit-level=low
      - name: All dependencies incl. dev tools (report only)
        run: npm audit || true

  homebridge:
    name: Homebridge ${{ matrix.homebridge }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.homebridge == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        homebridge: [latest, beta]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Install homebridge@${{ matrix.homebridge }}
        run: npm install --no-save homebridge@${{ matrix.homebridge }} && npx homebridge --version
      - run: npm run build
      - name: Start Homebridge with the plugin
        run: node scripts/homebridge-smoke.mjs
